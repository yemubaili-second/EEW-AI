name: build-own-apk

on: workflow_dispatch

concurrency:
  group: train-memory
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  TAG: train-memory

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 PyTorch（CPU 版）和 numpy
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy

      - name: 从 Release 恢复训练记忆
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "没有训练记忆 Release，视为首次运行"
            exit 0
          fi
          # 先删掉仓库里旧的断点，避免误用过期文件
          rm -rf ckpt
          mkdir -p /tmp/restore
          NAMES=$(gh release view "$TAG" --json assets -q '.assets[].name')

          if echo "$NAMES" | grep -qx "books.zip"; then
            ok=0
            for i in 1 2 3; do
              if gh release download "$TAG" -p books.zip -D /tmp/restore --clobber; then ok=1; break; fi
              echo "书籍包下载失败，第 $i 次重试"; sleep 10
            done
            if [ $ok -eq 0 ]; then echo "::error::书籍包下载失败，停止以防丢失记忆"; exit 1; fi
            unzip -o -q /tmp/restore/books.zip -d .
            echo "已恢复书籍包"
          fi

          if echo "$NAMES" | grep -qx "state.pt"; then
            ok=0
            for i in 1 2 3; do
              if gh release download "$TAG" -p state.pt -D /tmp/restore --clobber; then ok=1; break; fi
              echo "断点下载失败，第 $i 次重试"; sleep 10
            done
            if [ $ok -eq 0 ]; then echo "::error::断点下载失败，停止以防丢失进度"; exit 1; fi
            mkdir -p ckpt
            cp /tmp/restore/state.pt ckpt/state.pt
            echo "已恢复训练断点"
          fi

      - name: 下载新增的书籍（已在 books/ 里的跳过）
        run: python get_corpus.py

      - name: 查看语料大小
        run: wc -m corpus.txt

      - name: 训练模型（断点续训，从零开始不使用预训练权重）
        run: python -u train.py

      - name: 保存训练记忆到 Release（失败自动重试，无论训练成功与否）
        if: always()
        run: |
          rm -f /tmp/books.zip /tmp/state.pt
          if [ -d books ]; then zip -q -r /tmp/books.zip books; fi
          if [ -f ckpt/state.pt ]; then cp ckpt/state.pt /tmp/state.pt; fi

          FILES=""
          if [ -f /tmp/books.zip ]; then FILES="$FILES /tmp/books.zip"; fi
          if [ -f /tmp/state.pt ]; then FILES="$FILES /tmp/state.pt"; fi
          if [ -z "$FILES" ]; then echo "没有可保存的文件"; exit 0; fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "训练记忆" --notes "自动保存的书籍包和训练断点，请勿手动删除" || true
          fi

          OK=0
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" $FILES --clobber; then OK=1; break; fi
            echo "上传失败，第 $i 次重试"; sleep $((i * 10))
          done

          if [ $OK -eq 1 ]; then
            echo "保存成功，Release 中的文件："
            gh release view "$TAG" --json assets -q '.assets[] | "\(.name)  \(.size) 字节  \(.updatedAt)"'
          else
            echo "::warning::Release 保存失败，已通过 Artifact memory-backup 备份，请在本次运行页面下载"
          fi

      - name: 备份训练记忆为 Artifact（保留 90 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-backup
          path: |
            /tmp/books.zip
            /tmp/state.pt
          if-no-files-found: ignore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 打包 APK
        working-directory: android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: own-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
