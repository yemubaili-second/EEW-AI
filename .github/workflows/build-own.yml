name: build-own-apk

on: workflow_dispatch

concurrency:
  group: train-memory
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 PyTorch（CPU 版）和 numpy
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install numpy

      - name: 下载新增的书籍（已在仓库 books/ 里的跳过）
        run: python get_corpus.py

      - name: 查看语料大小
        run: wc -m corpus.txt

      - name: 训练模型（断点续训，从零开始不使用预训练权重）
        run: python -u train.py

      - name: 把书籍和训练断点保存回仓库（无论成功与否）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books ckpt
          if git diff --cached --quiet; then
            echo "没有新内容需要保存"
            exit 0
          fi
          git commit -m "保存训练记忆 run ${{ github.run_number }}"
          for i in 1 2 3; do
            git fetch origin main
            if git merge --no-edit -X ours origin/main; then
              if git push origin HEAD:main; then
                echo "推送成功"
                exit 0
              fi
            fi
            echo "推送冲突，第 $i 次重试"
            sleep 15
          done
          echo "推送失败"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: 打包 APK
        working-directory: android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: own-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
