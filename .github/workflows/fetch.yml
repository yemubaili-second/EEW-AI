name: fetch-corpus

on: workflow_dispatch

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 下载语料
        run: python get_corpus.py
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: corpus.txt
