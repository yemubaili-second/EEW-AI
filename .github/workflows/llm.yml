name: build-llm-apk

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 下载 Qwen2.5-0.5B 模型
        run: |
          mkdir -p model
          curl -L -o model/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -lh model

      - name: 下载 llama.cpp 源码
        run: git clone --depth 1 https://github.com/ggerganov/llama.cpp.git

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 编译 Android 示例 App
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 查找生成的 APK
        run: find llama.cpp/examples/llama.android -name "*.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: llm-apk
          path: llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: model/*.gguf
