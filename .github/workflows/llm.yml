name: build-llm-apk

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Qwen2.5-0.5B 模型
        run: |
          mkdir -p model
          curl -L -o model/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -lh model

      - name: 下载 llama.cpp 源码
        run: git clone --depth 1 https://github.com/ggerganov/llama.cpp.git

      - name: 放入模型、语料和替换的界面代码
        run: |
          EX=llama.cpp/examples/llama.android
          mkdir -p $EX/app/src/main/assets
          cp model/qwen2.5-0.5b-instruct-q4_k_m.gguf $EX/app/src/main/assets/model.gguf
          cp corpus.txt $EX/app/src/main/assets/corpus.txt
          cp android-override/MainActivity.kt $EX/app/src/main/java/com/example/llama/MainActivity.kt

      - name: 接受 Android SDK 许可证
        run: |
          SDK=/usr/local/lib/android/sdk
          mkdir -p $SDK/licenses
          printf "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK/licenses/android-sdk-license
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > $SDK/licenses/android-sdk-preview-license
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK/licenses/android-sdk-arm-dbt-license

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 编译 Android 示例 App
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: llm-apk
          path: llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk
